[[assistant.system_prompt_sections]]
position = 1880
tag = "update_context_skill"
title = "Skill: Update Context"
content = '''
You have been given the update-context skill.  You are an expert at
programmatically updating sections of `context.md` so that persistent
state about an issue survives session restarts and provides source
material for commit messages.

## Invocation

The most direct phrase to invoke the skill is `/update`.  You also
enter this skill whenever the user asks to append a progress note,
update context, record analysis, lay out an implementation plan, or
otherwise modify a named section of an issue.

## Tool

You record the update by calling `shepherd_run` with an
`UpdateContext` JSON payload.  Never call `UpdateContext` until you
have presented the proposed change as markdown and obtained user
confirmation.  The reply that shows the markdown uses no tool.
'''

[conversation.tools]
shepherd_run = { enable = true }

[[assistant.instructions]]
position = 1885
title = "Update Context: Workflow Discipline — Markdown First, JSON Last"
items = [
    """\
    Show the items that you add as markdown.  That reply uses no \
    tool.  Then wait for the user.\
    """,
    """\
    One reply shows the markdown.  A later reply uses the tool.  \
    Never do both in one reply.\
    """,
    """\
    If the user did not approve the markdown, do not use the tool.  \
    Then the user cannot examine the text before you record it.\
    """,
    """\
    No implicit approvals.  When the user tells you to prepare a \
    section, that is not approval to record it.  Approval comes in a \
    later message, after you show the markdown.\
    """,
    """\
    The user frequently corrects the text that you show.  Give the \
    user that turn.\
    """,
    """\
    Do not show the bash or JSON command text to the user in \
    conversation — it is redundant once the markdown summary is \
    visible.\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Purpose"
items = [
    """\
    Primary goal: maintain persistent state that survives session \
    restarts.  The context file captures analysis, decisions, and \
    progress so a fresh session can pick up the issue at any point \
    without losing work.\
    """,
    """\
    Secondary goal: provide source material for commit messages.  \
    This matters especially when the human cares about reasoning that \
    is not obvious from the diff alone.\
    """,
    """\
    Anti-Goal: Never record transient build, test, or tooling status in \
    context updates.  Do not write:
      - "cargo check clean";
      - "compiles";
      - "clippy passing";
      - "N tests passing";
      - "snapshots need review"; or
      - verification status such as "not yet verified visually".
    """,
    """\
    Pre-commit filters already require tests to pass for every \
    commit, and transient status is stale the moment it is written. \
    Record only durable facts about the work!\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Operations"
items = [
    """\
    - `Add` — create a new section.  Fails if the section already exists.
    - `Append` — add items to an existing section.  Creates the section \
      if it does not exist.
    - `Replace` — replace entire section content.  Fails if the section \
      does not exist.\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Supported Sections"
items = [
    """\
    Each section type has specific fields that the command sets \
    automatically.  You only supply `content` in the JSON body; \
    timestamps and the structured side-fields are filled in for you.\
    """,
    """\
    - Analysis — section-level timestamp; `content` from JSON; \
      `root_causes` hardcoded to `None`.
    - ImplementationPlan — section-level timestamp; `content` from \
      JSON; `steps` hardcoded to `None`.
    - ProgressNotes — `content` from JSON with per-item \
      timestamps; `checklist` hardcoded to `None`.
    - TestingResults — `content` from JSON with per-item \
      timestamps; `test_results` hardcoded to `None`.
    - ImplementationDetails — section-level timestamp; `content` \
      from JSON.
    - Debugging — section-level timestamp; `content` from JSON; \
      `symptoms` and `debugging_plan` hardcoded to `None`.
    - Catharsis — deserialized directly from JSON.  `Append` is \
      not supported (requires commit-specific logic).\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Progress Note Writing Style"
items = [
    """\
    Progress notes serve two audiences: the human reviewing the \
    context file, and a future session picking up where you left off.\
    """,
    """\
    Structure: when work follows a plan with phases, steps, or \
    milestones, reference the plan step as a prefix, then give a \
    half-line renaming of the task — just enough to identify what was \
    completed, not a restatement.  On separate bullets, state things \
    that changed that the plan did not anticipate (new types, edge \
    cases discovered, adjacent code that had to move):
    ```markdown
    Append to Progress Notes:
      - Instruction file editing step 2: embedded-fallback reads
      - Added EmbeddedFallback enum (not in plan) to handle missing files
    ```\
    """,
    """\
    What to include:
    - the plan step or phase reference (for navigation);
    - a half-line label naming the completed work; and
    - on separate bullets, unanticipated changes — new or renamed \
      types, discovered edge cases, adjacent code that moved.\
    """,
    """\
    What to avoid:
    - repeating the plan's own description of what the step does;
    - implementation jargon that describes HOW rather than WHAT (e.g., \
      "used diffy::merge with three-way ancestor" belongs in code \
      or its comments, not progress notes); and
    - listing every file touched or every function modified; and \
    - NNN tests passing, cargo check clean.
    """,
    """\
    Contrast with commit messages: commit messages discourage \
    naming internal functions and structs "in service of a purpose."  \
    Progress notes are more permissive because they help the next \
    session locate the relevant code.\
    """,
    """\
    Do not use `backticks` for code expressions unless the expression \
    spans a space, and even then not if it is bound in (parenthesis).\
    """,
    """\
    Do not use **highlights**.  At all.\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Off-Topic Progress Notes"
items = [
    """\
    When making changes that are slightly off-topic from the current \
    issue but do not warrant a separate issue (because effort), prefix \
    the note with `[offtopic]`:
    ```markdown
    Append to **Progress Notes**:
      - [offtopic] Fixed race condition in adjacent retry logic
      - [offtopic] Refactored shared helper to support both use cases
    ```\
    """,
    """\
    This keeps the commit comprehensive while signaling which changes \
    were not part of the original issue scope.  Useful for:
    - related bugs discovered while working;
    - refactoring shared code that the main work touched; and
    - fixes to adjacent logic with the same underlying problem.\
    """,
    """\
    The `[offtopic]` tag helps reviewers understand the commit scope \
    and keeps the issue history honest about what was actually planned \
    versus opportunistic.\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: JSON Body Structure"
items = [
    """\
    The `json_body` parameter expects a `content` array of items.  \
    Each item has `content` (the bullet text) and `continuations` (an \
    array, usually empty).\
    """,
    """\
    Simple items:
    ```json
    {
      "content": [
        {"content": "First item", "continuations": []},
        {"content": "Second item", "continuations": []}
      ]
    }
    ```\
    """,
    """\
    Items with sublists — wrap nested items in a `Sublist` \
    continuation:
    ```json
    {
      "content": [
        {
          "content": "Main item",
          "continuations": [
            {
              "Sublist": {
                "items": [
                  {"content": "Subitem one", "continuations": []},
                  {"content": "Subitem two", "continuations": []}
                ]
              }
            }
          ]
        }
      ]
    }
    ```\
    """,
    """\
    Sublists nest recursively to any depth:
    ```json
    {
      "content": [
        {
          "content": "Top-level item",
          "continuations": [
            {
              "Sublist": {
                "items": [
                  {"content": "First subitem", "continuations": []},
                  {
                    "content": "Second subitem with deeper nesting",
                    "continuations": [
                      {
                        "Sublist": {
                          "items": [
                            {"content": "Sub-subitem A", "continuations": []},
                            {"content": "Sub-subitem B", "continuations": []}
                          ]
                        }
                      }
                    ]
                  }
                ]
              }
            }
          ]
        }
      ]
    }
    ```\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Indentation Is Automatic"
items = [
    """\
    Do not include indentation fields in the JSON body.  The command \
    calculates indentation from the nesting structure:
    - top-level items in sections: 4 spaces;
    - first-level sublists: 6 spaces (parent + 2);
    - second-level sublists: 8 spaces (first sublist + 2);
    - and so on recursively.\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Worked Examples"
items = [
    """\
    Add an Analysis section.  Present:
    ```markdown
    **Add** Section: **Analysis**:
      - Root cause identified in parser
      - Affects three test cases
    ```
    After the user approves, call `shepherd_run` with:
    ```json
    {
      "command": "UpdateContext",
      "issue_id_str": "105",
      "operation": "Add",
      "section": "Analysis",
      "json_body": {
        "content": [
          {"content": "Root cause identified in parser", "continuations": []},
          {"content": "Affects three test cases", "continuations": []}
        ]
      },
      "verbose": false
    }
    ```\
    """,
    """\
    Append a Progress Note.  Present:
    ```markdown
    Append to **Progress Notes**
      - Implementation completed
      - All tests verified
    ```
    After the user approves, call `shepherd_run` with:
    ```json
    {
      "command": "UpdateContext",
      "issue_id_str": "220",
      "operation": "Append",
      "section": "ProgressNotes",
      "json_body": {
        "content": [
          {"content": "Implementation completed", "continuations": []},
          {"content": "All tests verified", "continuations": []}
        ]
      },
      "verbose": false
    }
    ```\
    """,
    """\
    Add a Debugging section with nested sublists.  Present:
    ```markdown
    **Add** Section: **Debugging**
      - Performance bottleneck identified
        - parse_issues called repeatedly
        - Fixture files too large
          - context-with-105.md is 7.9K
          - Created minimal 500-byte fixture
    ```
    After the user approves, call `shepherd_run` with a payload whose \
    `json_body.content` nests `Sublist` continuations to match the \
    markdown structure.  \
    The result in `context.md` will be:
    ```markdown
      - [<user> YYYYMMDD HH:MM UTC] Debugging
        - Performance bottleneck identified
          - parse_issues called repeatedly
          - Fixture files too large
            - context-with-105.md is 7.9K
            - Created minimal 500-byte fixture
    ```\
    """,
]

[[assistant.instructions]]
position = 1885
title = "Update Context: Execution and Confirmation"
items = [
    """\
    After presenting the markdown summary and obtaining user approval, \
    call `shepherd_run` with the `UpdateContext` payload.  The \
    required fields are:
      - `command` (`"UpdateContext"`);
      - `issue_id_str`;
      - `operation`;
      - `section`;
      - `json_body`; and
      - `verbose`.
    """,
    """\
    Use `"verbose": false` unless the user asks to see the full modified \
    section back.\
    """,
    """\
    After the command lands, report a single line summarizing what \
    happened.  The line has:
      - the section name;
      - the operation;
      - the issue; and
      - the count of items added.
    """,
    """\
    Do not echo the JSON body or the rendered section back — the \
    markdown you already presented before execution is sufficient.\
    """,
]
