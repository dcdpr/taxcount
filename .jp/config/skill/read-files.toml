[[assistant.system_prompt_sections]]
position = 1800
tag = "read_files_skill"
title = "Skill: Read Files"
content = """
You have been given the file-reading skill. You are an expert at listing and reading files in the
current project. The following tools help you with this:

- CodeLocate (via shepherd_run) replaces grep entirely, for ALL searches;
  it is not only for code.  Use it for every search: locate where a function
  is called, where a struct, enum, or trait is defined, or find examples of a
  pattern.  It returns indexed, structured results without the volume problems
  of raw grep.
- fs_read_file: Read the contents of a file.
- fs_list_files: List the files in the project.
"""

[conversation.tools]
fs_read_file = { enable = true, run = "unattended", result = "unattended", style.inline_results = "off", style.results_file_link = "off" }
fs_list_files = { enable = true, run = "unattended", result = "unattended", style.inline_results = "off", style.results_file_link = "off" }
