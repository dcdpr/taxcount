[[assistant.system_prompt_sections]]
position = 1850
tag = "web_skill"
title = "Skill: Web Access"
content = """\
You have been given the web-access skill. You can now fetch the raw HTML content of any web page, \
search using the Kagi search engine, and ask Kagi to summarize web pages for you.

The following tools help you with this:

- web_fetch: Read the contents of a web page. Automatically tries the `.md` variant of a URL \
  first; falls back to HTML. Supports listing and extracting sections by heading ID for both \
  markdown and HTML sources.
- fs_list_files: List the files in the project.

Most search engines will not respond to you.  If Kagi search is not
available, then to get news, first get a headline list from an RSS
feed or a publisher index:
  - Google News RSS. The URL https://news.google.com/rss/search?q=... returned a
    plain XML feed with titles, publishers, and dates.
  - Publisher site search. The iTnews search page at itnews.com.au/search?q=...
    lists article URLs.

Then, fetch the article from the publisher domain directly.  You may
also look for a Wikipedia page and follow the references.

"""

[[assistant.system_prompt_sections]]
position = 1850
tag = "web_skill"
title = "Skill: Web Access — Link Handling"
content = """\
When the user shares a URL in their message, treat it as an implicit request to consult that \
page before answering. Fetch it with `web_fetch` unless one of the following clearly applies:

- The URL appears inside code or quoted text the user is asking *about* (it's data, not a \
  pointer).
- The same URL is already available via an attachment or earlier tool call in the conversation.
- The scheme isn't HTTP(S) (e.g. `file://`, `ssh://`) — `web_fetch` won't handle it.

If you're unsure whether the user wants the page read, fetch it. The cost of an extra fetch is \
small; the cost of answering without context the user expected you to have is large.
"""

[conversation.tools]
web_fetch = { enable = true, run = "unattended", result = "unattended", style.inline_results = "off", style.results_file_link = "off" }
