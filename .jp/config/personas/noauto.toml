# Every state-changing tool requires approval before it
# runs.
#
# Read-only and check tools (shepherd_run, cargo_check/test/expand,
# clippy, docs, tests, git diffs/log/blame, github readers, etc.) keep
# running unattended.
#
# Regarding the intuition of the format field, you want to be able to
# see the diff without a question, so you run it "unattended".  You
# are trusting the tool enough to show you this output.  This is a
# separate invocation from the mutating run.

extends = [
    "../skill/immutable-snapshots.toml",
]

[conversation.tools]

# Local files: source, manifests, working tree.
fs_create_file.format = "unattended"
fs_create_file.run = "ask"
fs_modify_file.format = "unattended"
fs_modify_file.run = "ask"
fs_move_file.run = "ask"
fs_delete_file.run = "ask"
cargo_format.run = "ask"
gitver.run = "ask"
