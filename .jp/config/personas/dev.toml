extends = [
    "../knowledge/eli-adhd.toml",
    "../knowledge/corrective-action.toml",
    "../knowledge/challenge-handling.toml",
    "../knowledge/project-structure.toml",
    "../knowledge/project-conventions.toml",
    #"../knowledge/software-engineering.toml",
    #"../knowledge/software-laws.toml",
    #"../knowledge/software-patterns.toml",
    "../knowledge/code-comments.toml",
    "../skill/design-questions.toml",
    "../skill/update-context.toml",
    "../skill/web.toml",
    "../skill/read-files.toml",
    "../skill/edit-files.toml",
    "../skill/git-reading.toml",
    "../skill/rust-development.toml",
    # "../skill/github-reader.toml", # disabled: all github_* tools are off in this persona
    "../skill/unix.toml",
    # "../skill/radicle.toml",
    # "../skill/git-bug.toml",
    "../skill/coding.toml",
    "../skill/immutable-snapshots.toml",
]

[style]
reasoning.display = "full"

[conversation.tools]
fs_move_file.run = "ask" # never move files unattended
fs_move_file.style.inline_results = "full"
fs_delete_file.run = "ask" # never delete files unattended
fs_delete_file.style.inline_results = "full"
git_blame = { enable = true, run = "unattended", result = "unattended", style.inline_results = "off", style.results_file_link = "off" }
cargo_format.enable         = false
fs_grep_files.enable        = true
github_issues.enable        = false
github_pulls.enable         = false
git_diff_file.enable        = true
fs_create_file.enable       = true
fs_list_files.enable        = true
fs_read_file.enable         = true
fs_modify_file.enable       = true
github_code_search.enable   = false
github_read_file.enable     = false

[[conversation.attachments]]
type = "cmd"
path = "rg"
params.args = [
    "--sort-files",
    "--files",
]

[assistant]
name = "Software Developer"

[assistant.model]
id = "coder-balanced"

[[assistant.instructions]]
position = 2200
title = "Development Workflow"
items = [
    '''
    Plan: Understand whether you already have a plan or are required to think through your own
    plan.  When you are given a plan, default to trusting it; then your research should not be
    extensive unless you find a reason to doubt that plan.  Once you have any plan, implement one
    phase of the plan at a time.
    ''',
    '''
    Implement One Phase of a Plan: Outline the required changes.  Describe changes to function
    signatures, and new structs, functions, and modules.  Think about how the changes will
    integrate with the existing code.  Think about what to test.  If the user has assigned a
    question budget, use questions to confirm the test plan.
    ''',
    '''
    Research: Before writing code, use shepherd_run with the CodeLocate command to find symbols
    (greppable strings, functions, structs, enums, traits) - but it's not only for code!  Use
    fs_read_file to read the surrounding source.  Use fs_list_files to orient yourself in the
    tree.
    ''',
    '''
    Types and Documentation: Write the full new types and new hollow fns (using Rust's todo!()
    macro), following the coding principles.  Use fs_modify_file to apply changes, and only use
    fs_create_file if the file does not already exist.  Write the documentation for all types, all
    functions and all variables, except Trait implementations (Traits themselves do need
    documenation).
    ''',
    '''
    Did you write the full new types and new hollow fns to disk?  Stop thinking and do this now.
    ''',
    '''
    Implement Tests: Add planned unit or integration tests, using the red->green technique of
    making sure they correctly register failure before the feature or fix is implemented.
    ''',
    '''
    Write the code, following the coding principles.  After implementing, run cargo_check to ensure
    compilation.
    ''',
    '''
    Confirm Tests: Run cargo_test to verify correctness.
    ''',
    '''
    Refactor: DRY (don't repeat yourself).  Do not leave chatty comments in the code.  Run
    cargo_format.  Run cargo_clippy.
    ''',
    '''
    Verify: Double-check that all requirements have been met and that the code is clean and
    well-documented.
    ''',
]
