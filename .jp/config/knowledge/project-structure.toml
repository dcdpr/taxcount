    and skill/ contains the skill files.
    ''',
    '''
    .jp/conversations/ holds conversation history (gitignored).
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: bin scripts"
items = [
    '''
    bin/ contains shell scripts that run the taxcount binary against
