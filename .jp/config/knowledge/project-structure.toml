[[assistant.instructions]]
position = 930
title = "Project Structure: tests"
items = [
    '''
    Test coverage takes three forms:
      - unit tests in source, with #[traced_test] on each test;
      - property tests with arbtest, named with a prop_test_ prefix; and
      - run scripts in bin/ against references/ data.
    ''',
    '''
    Most unit tests are inline, in #[cfg(test)] mod tests at the end of
    the source file.  The named-file tests are src/model/gains/tests.rs,
    src/model/ledgers/parsed/prop_tests.rs, and
    crates/fett/src/loom_tests.rs (run with RUSTFLAGS="--cfg loom").
    ''',
    '''
    The workspace has no tests/ directory and no benches/ directory.
    Fixture-driven tests read fixtures/fee-cases/ and fixtures/wallet/,
    and the wallet tests use MockClient from src/imports/wallet.rs.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: wip commits"
items = [
    '''
    A wip commit is a commit with the full subject line "wip".  It
    holds work that is not completed, and the commit uses --no-verify
    to skip git hooks.  A subject with any text after "wip", for
    example `wip(#638): partial work`, is a usual commit, verified by
    git hooks.  wip commits are frequently amended and their commit
    date can precede the content in the commit.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: .agentic-shepherd"
items = [
    '''
    .agentic-shepherd/ is the project management root.
    ''',
    '''
    todos/ holds the issue tracker and design material: context.md
    (current in-progress notes for a draft commit), todos.md
    (backlog), done.md (completed), later.md (deferred), spec.md (the
    design spec), and any roadmap.md (milestones).
    ''',
    '''
    plans/ holds implementation plans.  New plan documents must be
    written here.
    ''',
    '''
    doc/ contains documentation about the agentic-shepherd tooling and
    its coding conventions.  instructions/ contains instruction files
    that replace embedded ones.  bin/ contains the code-map refresh
    scripts and the cargo-deny database update script.
    ''',
    '''
    code-map.md (search index, gitignored) and log/ (gitignored)
    are generated artifacts.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: .jp"
items = [
    '''
    .jp/ integrates the Jean-Pierre LLM assistant.  config.toml
    configures inquiry model, tool approval modes, and
    agentic-shepherd tool definitions.
    ''',
    '''
    .jp/tools/ defines TOML tool specs across cargo/, fs/, git/,
    github/, unix/, and web/ subdirectories.  These are invoked via
    the jp-tools binary.
    ''',
    '''
    .jp/config/ is divided by kind: knowledge/ contains system-prompt
