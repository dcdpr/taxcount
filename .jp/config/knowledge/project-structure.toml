[[assistant.instructions]]
position = 930
title = "Project Structure: ignore files"
items = [
    '''
    .gitignore ignores target/ and __pycache__/.
    ''',
    '''
    .ignore (for .jp, ripgrep, and search tools) additionally ignores:
      - .agentic-shepherd/code-map.md;
      - .agentic-shepherd/log/;
      - .git/;
      - .jp/conversations/; and
      - .jp/local-conversations/.
    ''',
    '''
    .ignore un-ignores:
      - target/doc/; and
      - target/log/.
    ''',
    '''
    .agentic-shepherd/.gitignore ignores /code-map.md and
    /tmpf-*.git-commit.
    ''',
    '''
    .jp/.gitignore ignores conversations/.
    ''',
    '''
    snapshots/.gitignore ignores *.snap.new.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: snapshots"
items = [
    '''
    snapshots/ holds gargoyle .snap files named
    test_module__test_name.snap.  .snap.new files are gitignored and
    must be reviewed via cargo insta review.
    ''',
    '''
    Do not tell the user that a snapshot waits for cargo insta review
    until you have examined its current state in this turn.  The user
    can accept snapshots between your turns, so a test result from an
    earlier turn does not show the current state.
    ''',
    '''
    snapshots/.gitignore ignores *.snap.new, so git status does not
    show these files.  To find the current state of a snapshot, read
    the git status of the .snap file, and also list the directory to
    see if the .snap.new file is on disk.
    ''',
    '''
    The four snapshot states are:
      - a .snap.new file is on disk, and the review is pending;
      - the .snap file is modified or staged, with no .snap.new file,
        and the user completed the review;
      - the .snap file is untracked, with no .snap.new file, and the
        user accepted a new snapshot; and
      - the .snap file is clean, with no .snap.new file, and no review
        is necessary.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: tests"
items = [
    '''
    Test coverage takes four forms:
      - unit tests in source;
      - integration tests in tests/;
      - benches/; and
      - batch/fuzz tests in bin/.
    ''',
    '''
    Unit tests live in src/module_name/tests.rs (not inline in the
    source file).  The source file declares #[cfg(test)] mod tests;
    at the top.
    ''',
    '''
    tests/ uses a consolidated single-binary pattern at
    tests/it/main.rs with many test modules and shared test_utils/.
    ''',
    '''
    Integration tests use gargoyle snapshots.  The assertion rules are
    in the "Assertion Allowlist" section of
    .agentic-shepherd/doc/patterns/general-deployments/integration-testing-guide.md.
    Rules for snapshot handling are in
    .agentic-shepherd/instructions/test-organization.md under
    "Integration Tests Use Gargoyle Snapshots".
    ''',
    '''
    benches/ provides criterion benchmarks.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: wip commits"
items = [
    '''
    A wip commit is a commit with the full subject line "wip".  It
    holds work that is not completed, and the commit uses --no-verify
    to skip git hooks.  A subject with any text after "wip", for
    example `wip(#638): partial work`, is a usual commit, verified by
    git hooks.  wip commits are frequently amended and their commit
    date can precede the content in the commit.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: .agentic-shepherd"
items = [
    '''
    .agentic-shepherd/ is the project management root.
    ''',
    '''
    todos/ holds the issue tracker and design material: context.md
    (current in-progress notes for a draft commit), todos.md
    (backlog), done.md (completed), later.md (deferred), spec.md (the
    design spec), and any roadmap.md (milestones).
    ''',
    '''
    plans/ holds implementation plans.  New plan documents must be
    written here.
    ''',
    '''
    doc/ holds longer-form documentation about using the agentic-shepherd project management
    tooling and its coding conventions: checklist-command-yaml.md, scoped-commits.md,
    rebuild-agent-instructions.md, and patterns/general-deployments/ (error handling, integration
    testing with gargoyle snapshots, module declaration architecture, plan step references,
    backporting, and sans-io.txt).
    ''',
    '''
    code-map.md (search index, gitignored) and log/ (gitignored)
    are generated artifacts.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: .jp"
items = [
    '''
    .jp/ integrates the Jean-Pierre LLM assistant.  config.toml
    configures inquiry model, tool approval modes, and
    agentic-shepherd tool definitions.
    ''',
    '''
    .jp/tools/ defines TOML tool specs across cargo/, fs/, git/,
    github/, unix/, and web/ subdirectories.  These are invoked via
    the jp-tools binary.
    ''',
    '''
    .jp/config/ splits the rest by kind: knowledge/ holds
    system-prompt sections such as this one, personas/ holds the
    persona files, skill/ holds the skill files, and stack/ holds the
    stack choices.
    ''',
    '''
    .jp/conversations/ holds conversation history (gitignored).
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: .claude"
items = [
    '''
    .claude/ (which only exists if selected as an init option)
    configures the Claude Code agent: settings.json +
    settings.local.json (sandbox-protected), statusline.sh, and
    commands/ with top-level slash commands plus an
    agentic-shepherd/ subdirectory for issue-management commands.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: bin scripts"
items = [
    '''
    bin/ holds a few Zsh/Bash utility scripts, and Python hook scripts
    wired into Claude Code (which only exists if selected as an init
    option) via .claude/settings.json.
    ''',
    '''
    Possible Hook scripts: auto-approve-use-block.py,
    let-underscore-hook.py, plan-directory-hook.py,
    rtfm-hook.py, say-hook.py, string-tax-hook.py,
    sycophancy-hook.py.
    ''',
