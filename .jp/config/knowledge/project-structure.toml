content = '''
# Knowledge: Project Structure

Here is the structure of the project.

Never let the tail wag the dog.  This project knowledge is a
descriptive snapshot of where things currently live, not a constraint
on where they should live.  It must never be a consideration in how to
refactor or move functionality.  The code and its design decide the
right shape; this knowledge follows them.  When a refactor moves
functionality and contradicts what is written here, the code wins and
this knowledge gets updated -- you do not keep code in an awkward
place, or decline to move it, merely because a document describes it
where it is.
'''

