    Possible Utility scripts: code-map-refresh-live.zsh +
    nohup-code-map-refresh.zsh (refresh the gitignored code map),
    deny-update.sh, fmt-nightly.zsh, gitver.sh.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: documentation"
items = [
    '''
    Library documentation lives in target/doc/ and target/doc/src/.
    Generate it with `cargo doc-all`.  Always read crate docs there
    before using a dependency (especially onlyerror, gargoyle-snaps, and
    onlyargs).
    ''',
    '''
    .agentic-shepherd/doc/ holds scoped-commits.md,
    checklist-command-yaml.md, and patterns/general-deployments/.
    ''',
    '''
    MANDATORY documents:
    - before you write code or plans, read
      target/doc/onlyerror/index.html (the derive(Error) macro DSL) and
