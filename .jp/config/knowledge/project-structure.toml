[[assistant.instructions]]
position = 930
title = "Project Structure: anti-patterns"
items = [
    '''
    Never use mod.rs files.  Use the named-file pattern:
    module_name.rs alongside a module_name/ directory for any
    children.
    ''',
    '''
    Never use #[path = "..."] attributes on modules.
    ''',
    '''
    Do not add new test code to an implementation source file.  Put
    new unit tests in src/<module>/tests.rs, declared with
    #[cfg(test)] mod tests; at the top of the implementation file.
    The inline test modules that are in the code at this time stay
    until an issue moves them.
    ''',
]
