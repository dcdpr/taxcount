[[conversation.attachments]]
type = "cmd"
path = "sh"
params.args = ["-c", "cargo metadata --no-deps --format-version=1 | jq -r '.packages[].name' | sort"]
params.description = "Workspace crate names"

[[assistant.system_prompt_sections]]
position = 900
tag = "Project Structure"
content = '''
# Knowledge: Project Structure

Here is the structure of the project.

Never let the tail wag the dog.  This project knowledge is a
descriptive snapshot of where things currently live, not a constraint
on where they should live.  It must never be a consideration in how to
refactor or move functionality.  The code and its design decide the
right shape; this knowledge follows them.  When a refactor moves
functionality and contradicts what is written here, the code wins and
this knowledge gets updated -- you do not keep code in an awkward
place, or decline to move it, merely because a document describes it
where it is.
'''

[[assistant.instructions]]
position = 930
title = "Project Structure: crate layout"
items = [
    '''
    The root Cargo.toml is the taxcount package and also the workspace
    root.  The workspace members are:
      - crates/esploda, an Esplora API client that is sans-io, with an
        optional bitcoind feature;
      - crates/fett, a concurrent map that calculates each value one
        time and then keeps it;
      - crates/gitver, a build-time library that records the git hashes
        of the source files;
      - tools/bootstrap-checkpoint, a CLI that writes a first
        checkpoint file from a bootstrap CSV;
      - tools/kraken-export-fix, a CLI that corrects the running
        balances in an edited Kraken ledger export;
      - tools/ohlc-ness, a CLI that downloads exchange rates and
        writes the exchange rates database; and
      - tools/query-exchange-rates, a CLI that reads the exchange
        rates database.
    ''',
    '''
    The dependency direction is one way.  The taxcount package depends
    on esploda, fett, and gitver.  Each tools/ crate depends on the
    taxcount library with path = "../../".  The crates/ members do not
    depend on taxcount.
    ''',
    '''
    Each crate has edition 2021 and license MPL-2.0.  The root package
    has rust-version 1.93.0, publish = false, and
    [lints.rust] unsafe_code = "forbid".
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: the binary"
items = [
    '''
    src/main.rs is the taxcount binary.  It parses struct Args with
    onlyargs_derive, then run() loads a checkpoint, reads Kraken and
    wallet CSVs, resolves wallet rows against bitcoind or Esplora,
    calls State::resolve() and CheckList::execute(), and writes the
    worksheet CSVs and the output checkpoint.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: dependencies"
items = [
    '''
    Runtime deps: bdk, miniscript, esploda, fett, gitver, chrono, csv,
    ron, serde, serde_json, rust_decimal, onlyargs, onlyargs_derive,
    thiserror, error-iter, tracing, tracing-subscriber, ureq, rayon,
    parking_lot, directories, is-terminal, base64, and log (optional,
    for the optimize feature).
    ''',
    '''
    Dev deps: arbtest, similar-asserts, tracing-log, tracing-test, and
    serde_json.  Build dep: gitver.  Features: default = optimize + tls.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: source modules"
items = [
    '''
    The purpose of each top module in src/ is:
      - basis, FIFO cost-basis tracking with PoolAsset, and
        State::resolve() in basis/split.rs;
      - model, the data types: State, Event, LedgerParsed, the gains
        worksheet, amounts, and exchange rates;
      - imports, the CSV readers for Kraken, wallets, and tx tags;
      - client, the memo-cached Bitcoin backends;
      - util, the FIFO and the year checks; and
      - errors, re-exports of every error type.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: top-level non-source files"
items = [
    '''
    The purpose of each top-level directory is:
      - references/, input data for the bin/ run scripts and the unit
        tests, with the exchange rates database in
        references/exchange-rates-db/;
      - fixtures/, test data: Kraken fee scenarios, MockClient RON
        files, and saved run output for comparison;
      - runs/, gitignored output of the bin/ run scripts;
      - doc/, design documents; and
      - supply-chain/, the cargo-vet state.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: cargo aliases"
items = [
    '''
    The aliases in .cargo/config.toml are:
      - clippy-all and clippy-all-update-crates, workspace clippy with
        --deny warnings;
      - doc-all and doc-all-update-crates, workspace docs with private
        items;
      - test-all, test-ignored, and test-all-update-crates, workspace
        tests with --no-fail-fast;
      - deny-check-offline, deny-check-update, deny-init, and
        deny-install, cargo-deny;
      - ir, insta-snapshots-unused-find, and
        insta-snapshots-unused-delete, cargo insta (the workspace has
        no insta dependency); and
      - crit, cargo bench --bench parse_issue (the workspace has no
        such bench).
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: the library"
items = [
    '''
    src/lib.rs is the only module tree.  It declares basis, client,
    errors, imports, model, and util as pub mod, re-exports bdk, and
    defines gitver_hashes with include!() of OUT_DIR/gitver_hashes.rs
    from build.rs.  src/main.rs uses the library through taxcount::
    paths and declares no modules.
    ''',
]

[[assistant.instructions]]
position = 930
title = "Project Structure: ignore files"
items = [
    '''
    .gitignore ignores:
      - target/;
      - .~*;
      - runs/kraken-tests/, runs/electrum-testnet/,
