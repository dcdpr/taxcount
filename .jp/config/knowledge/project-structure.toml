    - before you write an integration test, read
      .agentic-shepherd/doc/patterns/general-deployments/integration-testing-guide.md
      (Gargoyle snapshot patterns are in its tests section); and
    - before you add a module or an integration test, read
      .agentic-shepherd/doc/patterns/general-deployments/module-declaration-architecture.md
      (the rules for module declarations in lib.rs and main.rs).
    ''',
    '''
    Project specification is in .agentic-shepherd/todos/spec.md.
    Plans must be written to .agentic-shepherd/plans/.
    ''',
    '''
    doc/ at top level holds design documents specific to this project.
    ''',
]

