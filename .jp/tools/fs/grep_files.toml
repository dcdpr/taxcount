[conversation.tools.fs_grep_files]
enable = false
run = "unattended"

source = "local"
command = "jp-tools {{context}} {{tool}}"
summary = "Grep files in the project's local filesystem."
description = '''
Recall that the shepherd_run tool has the CodeLocate subcommand, a
fast indexed unified search for fns, structs, enums, and traits (with
fuzzy + grep fallback).  If you are looking for code in the project,
learn houw to use that command well.

If misused, this fs_grep_files tool can return *A LOT* of matches,
making it difficult to parse the results. It is recommended to use
search patterns that are as specific as possible to the content you
are looking for.

If the number of fs_grep_files results exceeds 100, the `context`
option is disabled, and 50 matches are returned without context. You
can re-run the tool with a more specific pattern or limited to
specific paths to narrow down the results with context.
'''

examples = """
Search for a function definition:
```json
{"pattern": "fn build_thread", "paths": ["crates/jp_cli/src"]}
```

Search with context lines:
```json
{"pattern": "ToolDefinition", "context": 3, "paths": ["crates/jp_llm"]}
```

Search across all files (excepting those listed in .ignore):
```json
{"pattern": "TODO|FIXME"}
```
"""

[conversation.tools.fs_grep_files.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.fs_grep_files.parameters.pattern]
type = "string"
required = true
summary = "Regular expression to filter the results by."

[conversation.tools.fs_grep_files.parameters.context]
type = "integer"
default = 0
summary = "Number of lines of context to include before and after the matching lines."

[conversation.tools.fs_grep_files.parameters.paths]
type = "array"
items.type = "string"
summary = "Optional list of files or directories to search."
description = """
If unspecified, all files in the project will be returned.
"""
